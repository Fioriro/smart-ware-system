<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock | 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: #F8FAFC;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px -5px rgba(148, 163, 184, 0.15);
        }
        .btn-primary {
            background: #0F172A;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
        }
        .btn-primary:hover {
            box-shadow: 0 15px 25px -5px rgba(15, 23, 42, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-slate-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-slate-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <!-- 登录卡片 -->
    <div class="glass p-10 rounded-2xl w-full max-w-md text-center relative z-10" data-testid="login-card">
        <!-- Logo -->
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-2xl mb-4" style="box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-700">SmartStock</h1>
            <p class="text-slate-500 mt-2">智能库存管理助手</p>
        </div>

        <!-- 登录表单 -->
        <form class="space-y-5">
            <div class="text-left">
                <label class="block text-sm font-medium text-slate-700 mb-2">用户名</label>
                <input 
                    type="text" 
                    data-testid="username-input"
                    placeholder="请输入用户名"
                    class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 focus:border-slate-300 outline-none transition-all text-slate-700 placeholder-slate-400"
                >
            </div>

            <div class="text-left">
                <label class="block text-sm font-medium text-slate-700 mb-2">密码</label>
                <input 
                    type="password" 
                    data-testid="password-input"
                    placeholder="请输入密码"
                    class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 focus:border-slate-300 outline-none transition-all text-slate-700 placeholder-slate-400"
                >
            </div>

            <div class="flex justify-end">
                <a href="#" class="text-sm text-slate-500 hover:text-slate-700 font-medium transition" data-testid="forgot-password-link">忘记密码？</a>
            </div>

            <button 
                type="submit" 
                data-testid="login-button"
                class="btn-primary w-full text-white p-4 rounded-xl font-semibold transition-all transform hover:scale-[1.02]"
            >
                登录系统
            </button>
        </form>

        <!-- 错误提示 -->
        <div class="mt-4 p-4 bg-rose-50 rounded-xl border border-rose-100 hidden" data-testid="error-message">
            <p class="text-sm text-rose-600 font-medium">用户名或密码错误</p>
        </div>

        <!-- 版权 -->
        <p class="text-slate-400 text-xs mt-8">© 2026 SmartStock. All rights reserved.</p>
    </div>

</body>
</html>
