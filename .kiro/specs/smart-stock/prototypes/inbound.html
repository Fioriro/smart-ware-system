<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock | 入库管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 20px -5px rgba(148, 163, 184, 0.15); }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid #F1F5F9; box-shadow: 0 4px 20px -5px rgba(148, 163, 184, 0.15); }
        .btn-primary { background: #0F172A; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2); }
    </style>
</head>
<body class="min-h-screen">
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 glass px-8 py-4 rounded-2xl flex gap-8 z-50">
        <a href="dashboard.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path></svg>
            仪表盘
        </a>
        <a href="products.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            库存
        </a>
        <a href="inbound.html" class="text-slate-900 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            入库
        </a>
        <a href="outbound.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            出库
        </a>
        <a href="logs.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            审计
        </a>
        <a href="suppliers.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            供应商
        </a>
        <button class="text-slate-400 hover:text-rose-500 font-semibold">登出</button>
    </nav>
    <main class="max-w-4xl mx-auto pt-28 px-4 pb-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-700">入库指令中心</h1>
            <p class="text-slate-500 mt-2">录入商品入库信息</p>
        </div>
        <div class="flex justify-center mb-8">
            <div class="card rounded-2xl p-1.5 inline-flex">
                <button class="px-6 py-3 btn-primary text-white rounded-xl font-semibold">单个入库</button>
                <button class="px-6 py-3 text-slate-500 hover:text-slate-700 rounded-xl font-semibold">批量入库</button>
            </div>
        </div>
        <div class="card p-10 rounded-2xl mb-8">
            <form class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">SKU编码 <span class="text-rose-500">*</span></label>
                        <input type="text" placeholder="输入或扫描SKU编码" class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 focus:border-slate-300 outline-none text-slate-700 placeholder-slate-400">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">商品名称</label>
                        <input type="text" value="MacBook Pro 16寸" readonly class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">供应商 <span class="text-rose-500">*</span></label>
                        <select class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700">
                            <option value="">请选择供应商</option>
                            <option value="1">苹果官方渠道</option>
                            <option value="2">京东自营</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">入库数量 <span class="text-rose-500">*</span></label>
                        <input type="number" min="1" value="10" class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3">备注</label>
                    <textarea rows="3" placeholder="输入备注信息（可选）" class="w-full p-4 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 placeholder-slate-400 resize-none"></textarea>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" class="flex-1 p-4 rounded-xl border-2 border-slate-200 text-slate-500 font-semibold hover:bg-slate-50 transition">重置</button>
                    <button type="submit" class="flex-1 btn-primary text-white p-4 rounded-xl font-semibold transition-all hover:scale-[1.02]">确认入库</button>
                </div>
            </form>
        </div>
        <div class="card rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-700">最近入库记录</h3>
            </div>
            <div class="space-y-3 p-6">
                <div class="glass p-4 rounded-xl flex justify-between items-center hover:shadow-md transition">
                    <div class="flex gap-4 items-center">
                        <span class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl text-xs font-bold">入库</span>
                        <div>
                            <p class="text-sm font-semibold text-slate-700">MacBook Pro 16寸 <span class="text-slate-400 font-normal">MACBOOK-001</span></p>
                            <p class="text-xs text-slate-500 mt-1">供应商：苹果官方渠道 | 操作人：admin</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-emerald-600">+10</p>
                        <p class="text-xs text-slate-400">2026-01-21 14:30</p>
                    </div>
                </div>
                <div class="glass p-4 rounded-xl flex justify-between items-center hover:shadow-md transition">
                    <div class="flex gap-4 items-center">
                        <span class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl text-xs font-bold">入库</span>
                        <div>
                            <p class="text-sm font-semibold text-slate-700">iPhone 15 Pro 256GB <span class="text-slate-400 font-normal">IPHONE-15-PRO</span></p>
                            <p class="text-xs text-slate-500 mt-1">供应商：京东自营 | 操作人：admin</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-emerald-600">+20</p>
                        <p class="text-xs text-slate-400">2026-01-21 11:15</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
