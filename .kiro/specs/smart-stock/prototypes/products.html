<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock | 库存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 20px -5px rgba(148, 163, 184, 0.15); }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid #F1F5F9; box-shadow: 0 4px 20px -5px rgba(148, 163, 184, 0.15); }
        .btn-primary { background: #0F172A; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2); }
        .low-stock-row { background: #FFF1F2; border-left: 4px solid #F43F5E; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 glass px-8 py-4 rounded-2xl flex gap-8 z-50">
        <a href="dashboard.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path></svg>
            仪表盘
        </a>
        <a href="products.html" class="text-slate-900 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            库存
        </a>
        <a href="inbound.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            入库
        </a>
        <a href="outbound.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            出库
        </a>
        <a href="logs.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            审计
        </a>
        <a href="suppliers.html" class="text-slate-500 hover:text-slate-700 font-semibold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            供应商
        </a>
        <button class="text-slate-400 hover:text-rose-500 font-semibold">登出</button>
    </nav>
    <main class="max-w-7xl mx-auto pt-28 px-4 pb-12">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-700">库存资产清单</h1>
                <p class="text-slate-500 mt-1">管理所有商品信息</p>
            </div>
            <button class="btn-primary text-white px-6 py-3 rounded-xl font-semibold transition-all hover:scale-[1.02] flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增商品
            </button>
        </div>
        <div class="card rounded-2xl p-6 mb-6">
            <div class="flex items-center gap-4 flex-wrap">
                <div class="flex-1 min-w-[300px] relative">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="搜索SKU或商品名称..." class="w-full pl-12 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 focus:border-slate-300 outline-none text-slate-700 placeholder-slate-400">
                </div>
                <select class="px-5 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 font-medium">
                    <option value="">全部分类</option>
                    <option value="1">电子产品</option>
                    <option value="2">办公用品</option>
                </select>
                <label class="flex items-center gap-2 cursor-pointer bg-rose-50 px-4 py-3 rounded-xl border border-rose-100">
                    <input type="checkbox" class="w-5 h-5 text-rose-500 rounded-lg">
                    <span class="text-sm font-medium text-rose-600">仅显示低库存</span>
                </label>
            </div>
        </div>
        <div class="card rounded-2xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">SKU</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">商品名称</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">分类</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">单位</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">库存数量</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">预警阈值</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">成本价</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">售价</th>
                        <th class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-6 py-5 text-sm font-semibold text-slate-700">IPHONE-15-PRO</td>
                        <td class="px-6 py-5 text-sm text-slate-700">iPhone 15 Pro 256GB</td>
                        <td class="px-6 py-5"><span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-medium rounded-full">电子产品</span></td>
                        <td class="px-6 py-5 text-sm text-slate-500">台</td>
                        <td class="px-6 py-5 text-sm font-bold text-slate-700">45</td>
                        <td class="px-6 py-5 text-sm text-slate-500">10</td>
                        <td class="px-6 py-5 text-sm text-slate-500">¥7,999</td>
                        <td class="px-6 py-5 text-sm text-slate-700 font-medium">¥8,999</td>
                        <td class="px-6 py-5">
                            <div class="flex gap-2">
                                <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                <button class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </td>
                    </tr>
                    <tr class="low-stock-row hover:bg-rose-100/50 transition-colors">
                        <td class="px-6 py-5 text-sm font-semibold text-slate-700">MACBOOK-001</td>
                        <td class="px-6 py-5 text-sm text-slate-700">MacBook Pro 16寸 <span class="ml-2 px-2 py-1 bg-rose-500 text-white text-xs font-bold rounded-full">低库存</span></td>
                        <td class="px-6 py-5"><span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-medium rounded-full">电子产品</span></td>
                        <td class="px-6 py-5 text-sm text-slate-500">台</td>
                        <td class="px-6 py-5 text-sm font-bold text-rose-600">3</td>
                        <td class="px-6 py-5 text-sm text-slate-500">10</td>
                        <td class="px-6 py-5 text-sm text-slate-500">¥18,999</td>
                        <td class="px-6 py-5 text-sm text-slate-700 font-medium">¥21,999</td>
                        <td class="px-6 py-5">
                            <div class="flex gap-2">
                                <button class="px-3 py-2 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-xl hover:bg-emerald-100 transition">补货</button>
                                <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            </div>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-6 py-5 text-sm font-semibold text-slate-700">AIRPODS-PRO2</td>
                        <td class="px-6 py-5 text-sm text-slate-700">AirPods Pro 2</td>
                        <td class="px-6 py-5"><span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-medium rounded-full">电子产品</span></td>
                        <td class="px-6 py-5 text-sm text-slate-500">个</td>
                        <td class="px-6 py-5 text-sm font-bold text-slate-700">28</td>
                        <td class="px-6 py-5 text-sm text-slate-500">15</td>
                        <td class="px-6 py-5 text-sm text-slate-500">¥1,599</td>
                        <td class="px-6 py-5 text-sm text-slate-700 font-medium">¥1,899</td>
                        <td class="px-6 py-5">
                            <div class="flex gap-2">
                                <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                <button class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="px-6 py-5 border-t border-slate-100 flex items-center justify-between bg-slate-50/50">
                <p class="text-sm text-slate-500">显示 1-10 条，共 128 条</p>
                <div class="flex gap-2">
                    <button class="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition font-medium">上一页</button>
                    <button class="px-4 py-2 btn-primary text-white rounded-xl font-medium">1</button>
                    <button class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 transition font-medium">2</button>
                    <button class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 transition font-medium">3</button>
                    <button class="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition font-medium">下一页</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
